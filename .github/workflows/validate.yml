name: Validate documentation site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for rendered title integration checks
        run: npx playwright install --with-deps chromium

      - name: Validate site contract
        run: npm run check:ci

      - name: Run browser assertion unit tests
        run: npm test

      - name: Check whitespace
        run: git diff --check
